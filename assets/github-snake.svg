<svg width="880" height="192" viewBox="0 0 880 192" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub contribution snake animation">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#9AE6B4"/>
      <stop offset="30%" stop-color="#68D391"/>
      <stop offset="70%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#2F855A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="880" height="192" fill="#0D1117"/>

  <g fill="none" stroke="url(#snakeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M24 110 C 64 110, 64 70, 104 70 S 172 150, 212 150 S 284 70, 324 70 S 396 150, 436 150 S 504 70, 544 70 S 612 150, 652 150 S 720 70, 760 70 S 820 110, 840 110" stroke-dasharray="920" stroke-dashoffset="920">
      <animate attributeName="stroke-dashoffset" from="920" to="0" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <path d="M792 110 C 816 110, 832 102, 840 88 L 848 76" fill="none" stroke="url(#snakeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="76" r="16" fill="#9AE6B4"/>
    <circle cx="846" cy="74" r="4" fill="#0D1117"/>
    <circle cx="858" cy="74" r="4" fill="#0D1117"/>
    <path d="M846 88 Q 850 92 854 88" fill="none" stroke="#0D1117" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g opacity="0.95" fill="#0D1117">
    <circle cx="72" cy="110" r="4"/>
    <circle cx="104" cy="70" r="4"/>
    <circle cx="172" cy="150" r="4"/>
    <circle cx="212" cy="150" r="4"/>
    <circle cx="284" cy="70" r="4"/>
    <circle cx="324" cy="70" r="4"/>
    <circle cx="396" cy="150" r="4"/>
    <circle cx="436" cy="150" r="4"/>
    <circle cx="504" cy="70" r="4"/>
    <circle cx="544" cy="70" r="4"/>
    <circle cx="612" cy="150" r="4"/>
    <circle cx="652" cy="150" r="4"/>
    <circle cx="720" cy="70" r="4"/>
    <circle cx="760" cy="70" r="4"/>
  </g>
</svg>
